name: Windows Package CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -s tests -q

      - name: Build package
        run: |
          python -m build

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = "marsrover_cd-$('${{ github.ref_name }}'.TrimStart('v'))-py3-none-any.whl"
          if (-not (Test-Path "dist/$expected")) {
            throw "Tag ${{ github.ref_name }} does not match the version in pyproject.toml. Expected dist/$expected; found: $((Get-ChildItem dist).Name -join ', ')"
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*

  verify-install:
    needs: build-and-test
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist

      - name: Install wheel and run command
        shell: bash
        run: |
          python -m pip install dist/*.whl
          output="$(marsrover-cd)"
          echo "$output"

  deploy-windows:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name == 'push'
    runs-on: windows-2022

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist

      - name: Deploy Windows package
        shell: pwsh
        run: |
          Write-Host "Deploying package automatically on Windows 11"
          Get-ChildItem dist

          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "scripts\deploy_windows.ps1"

          if (-not (Test-Path $scriptPath)) {
            throw "Deployment script not found at $scriptPath"
          }

          powershell -ExecutionPolicy Bypass -File $scriptPath -ArtifactPath (Join-Path $env:GITHUB_WORKSPACE "dist") -DeployRoot "C:\Deploy\marsrover-cd"

  release:
    needs: [deploy-windows, verify-install]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
