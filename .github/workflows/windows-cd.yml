name: Windows Package CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -s tests -q

      - name: Build package
        run: |
          python -m build

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*

  deploy-windows:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name == 'push'
    runs-on: windows-2022

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist

      - name: Deploy Windows package
        shell: pwsh
        run: |
          Write-Host "Deploying package automatically on Windows 11"
          Get-ChildItem dist

          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "scripts\deploy_windows.ps1"

          if (-not (Test-Path $scriptPath)) {
            throw "Deployment script not found at $scriptPath"
          }

          powershell -ExecutionPolicy Bypass -File $scriptPath -ArtifactPath (Join-Path $env:GITHUB_WORKSPACE "dist") -DeployRoot "C:\Deploy\marsrover-cd"

  release:
    needs: deploy-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: dist/*
          generate_release_notes: true
